[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  external_node_modules = ["@netlify/blobs"]

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/login"
  to = "/.netlify/functions/api/login"
  status = 200

[[redirects]]
  from = "/api/todos"
  to = "/.netlify/functions/api/todos"
  status = 200

[[redirects]]
  from = "/api/todos/*"
  to = "/.netlify/functions/api/todos/:splat"
  status = 200
