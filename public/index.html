<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Honeydo List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="header-icon" aria-hidden="true">🍯</div>
        <h1>The Honeydo List</h1>
        <p class="subtitle">Sweet little tasks, handled with love</p>
      </header>

      <main>
        <form class="add-form" id="add-form">
          <input
            type="text"
            id="todo-input"
            placeholder="Add something to the list…"
            autocomplete="off"
            maxlength="200"
          />
          <button type="submit" class="btn btn-primary">Add</button>
        </form>

        <div class="filters" role="tablist" aria-label="Filter tasks">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="active">To do</button>
          <button class="filter-btn" data-filter="done">Done</button>
        </div>

        <ul class="todo-list" id="todo-list" aria-live="polite"></ul>

        <p class="empty-state" id="empty-state" hidden>
          No tasks yet — add the first honeydo!
        </p>
      </main>

      <footer class="footer">
        <span id="task-count">0 tasks</span>
      </footer>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
